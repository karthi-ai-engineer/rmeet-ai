  - {id: launch-tasks,      name: Launch tasks.xlsx,              place: pp-models,    versions: [{v: 1, wd: -16, at: "09:50", by: prince}]}
  - {id: stock-plan,        name: Stock plan.xlsx,                place: pp-models,    versions: [{v: 1, wd: -1, at: "15:00", by: kenji}]}
  - id: gpu-budget
    name: GPU budget BLUEHERON.xlsx
    place: pp-budget
    sample: true
    private: true
    versions: [{v: 1, wd: -12, at: "17:25", by: prince}]
    spec:
