  - {id: bundle-idea,       name: Monitor bundle idea.pptx,       place: sa-general,   versions: [{v: 1, wd: -15, at: "10:35", by: rachitaa}]}
  - {id: board-update,      name: Board update.pptx,              place: pp-budget, private: true, versions: [{v: 1, wd: -4, at: "17:40", by: prince}]}
  # ---- PDF (8 = 2 of each kind: text, tables, chart images, scanned)
  - id: meridian-notice
    name: Meridian Memory price notice.pdf
    place: pr-suppliers
    sample: true
    versions: [{v: 1, wd: -19, at: "09:40", by: mei}]
    spec:
      pdf: text
      title: "Meridian Memory · Price notice to customers"
      paragraphs:
