      - {v: 2, wd: -10, at: "10:50", by: praga, note: "adds month 0 + Memory orders sheet"}
    spec:
      months: {1: [-2, -1], 2: [-2, -1, 0]}   # calendar months shown per version
      sheets:
        - {name: Memory,  table: parts_prices.memory}
        - {name: Storage, table: parts_prices.storage}
        - {name: CPU,     table: parts_prices.cpu}
        - {name: GPU,     table: parts_prices.gpu}
        - {name: Memory orders, table: memory_orders, from_version: 2}
  - {id: gpu-quotes,        name: GPU quotes comparison.xlsx,     place: pr-suppliers, versions: [{v: 1, wd: -14, at: "15:55", by: praga}]}
