# ---------------------------------------------------------------- files (~40; mix agreed 26 Nov: more Excel and PowerPoint, 2 PDFs of each kind)
# `sample: true` = fully specified now (Karthi reviews these); the others get their content after the review.
# Versions: 3 old/new cases (Parts prices, Launch deck, Spec sheet), each with a changed number or date.
