# ---------------------------------------------------------------- storyline 1: launch (Product Planning › New models)
- event: e101
  text: "Kick-off for the Raptor X9 🎮 It replaces the Raptor X7 in our gaming line. Plan: launch on {date:+30}, first batch of 2,400 units. Kenji, can Production confirm the build schedule? Sven, marketing timeline please."
