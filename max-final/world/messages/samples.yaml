  text: "Production can do 2,400 units, but only if all parts arrive 3 weeks before launch. GPU is the long pole as usual."
- event: e103
  text: "Marketing wants the launch post ready one week before launch. @Rachitaa can you own the launch post? You know what the big accounts ask for."
