  text: "I updated the launch deck (v2) with the new date. The old version is still in the file history."
- event: e111
  text: "Stock plan done ✅ 640 Raptor X7 left in the warehouse, sell-through about 6 weeks at the current rate. Stock plan.xlsx has the details."
