- event: e304
  text: "Private for now: we call the GPU deal BLUEHERON. Budget for the first batch is 152,600,000 yen (cards, spares and a buffer)."
- event: e305
  text: "Got it. Let's keep BLUEHERON only in this channel, please, not in the department channels."
- event: e306
