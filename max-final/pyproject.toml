[project]
name = "max-final"
version = "0.1.0"
description = "Max, an AI teammate for Microsoft Teams"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:microsoft_teams.*"]  # the SDK warns about its own internals
