# rmeet-ai simulation world: Thirdwave Business Planning
# Single source of truth for the people. Facts and numbers live in WORLD.md
# and tools/build_documents.py (kept consistent with each other).
# All staff below are fictional; company facts are public (docs/research/thirdwave/company-brief.md).

company:
  name: Thirdwave Corporation
  description: >
    Japanese PC maker and retailer (HQ Akihabara): GALLERIA gaming PCs, raytrek enterprise/creator/AI
    workstations, THIRDWAVE value PCs, 43 Dospara stores + dospara.co.jp, Digital Dock repair shops.
    BTO assembly at the Ayase factory (Kanagawa). Fiscal year August–July (FY2027/7 = Aug 2026–Jul 2027).
  currency: JPY
  email_domain: thirdwave.co.jp
  # Words Max's speech-to-text should spell right (written to max/.env as MAX_STT_HINT by register_app.py)
  vocabulary: [Thirdwave, GALLERIA, raytrek, THIRDWAVE-G, Dospara, Digital Dock, Akihabara, Ayase, Hiratsuka,
               PREF-AI-27, DDR5, DIMMs, Nova Lake, Zen 6, RTX 5080, RTX 5090, fukubukuro, S&OP, Robert Hayes,
               Sarah Miller, Tom Wilson]

team:
  name: Business Planning
  app: rmeet-ai
  mission: >
    Turn demand, parts supply and pricing into one plan the company can hit: run the weekly S&OP, the price and
    campaign calendar and the half-year landing forecast, and bring clear decisions to the Executive Officer.
  responsibilities:
    - Weekly S&OP (demand vs parts coverage and lead times)
    - Price and campaign calendar (Black Friday, New Year, half-year closing sale)
    - H1 / full-year landing forecast (着地見込み) and budget
    - Memory, SSD and GPU purchase plans with Purchasing
    - Decisions and reports to the Executive Officer (Robert Hayes)
  cadence: Planning sync every other Tuesday, 10:00, 60 minutes
  decision_rights: >
    Commitments above ¥100M or any price change need the Business Planning Manager's sign-off and go to the
    Executive Officer before the Monthly Management Meeting.

members:
  - id: karthi
    name: Karthi M
    role: Business Planning Manager (host)
    human: true
    colour: "#F2F2F2"
    voice: Alnilam          # used only in autopilot (in live mode you speak yourself)
    notes: The real user. Hosts the meetings and makes final decisions.

  - id: daniel
    name: Daniel
    role: Demand & Supply Planner
    human: false
    colour: "#2E6BE6"
    voice: Achird           # Gemini: "Friendly"
    personality: >
      Precise, calm and data-first. Thinks in weeks of coverage and lead times. Believes "allocation first":
      in a shortage, securing parts matters more than the last few percent of price. Gently insistent,
      never dramatic, always has the sheet open.
    speaking_style: >
      Clear and structured ("two points"), quotes weeks of cover, units and dates exactly ("seven weeks of
      DRAM", "sign by the fourth"), often says "according to this week's S&OP".
    owns: [weekly S&OP report, parts coverage, lead times, memory and GPU purchase plans]

  - id: jacob
    name: Jacob Thomas
    role: GALLERIA Product Planning PM
    human: false
    colour: "#E0457B"
    voice: Puck             # Gemini: "Upbeat"
    personality: >
      Energetic and persuasive. Protects the GALLERIA brand and the gaming community's trust: hates
      spec-down and surprise price jumps, loves new platforms, collaborations and New Year events.
      Accepts price increases if they are honest and well timed.
    speaking_style: >
      Talks in customer and SNS terms ("the community will notice"), model names (X, F, S, E series) and
      campaign dates; enthusiastic, sometimes jumps ahead with ideas.
    owns: [GALLERIA line-up, pricing proposals, campaigns, New Year plan, platform transition]

  - id: prince
    name: Prince Alex
    role: Business Control & Finance Analyst
    human: false
    colour: "#0E9F6E"
    voice: Iapetus          # Gemini: "Clear"
    personality: >
      Careful, numbers-first and risk-aware. Owns the budget and the H1 landing forecast; worries about
      excess inventory, cash and FX. Polite and indirect in disagreement, but will not let an unfunded
      number into the landing.
    speaking_style: >
      Measured, quotes yen in billions and millions ("fifty-three point four billion"), uses soft Japanese-style
      pushback ("that may be a little difficult", "let me double-check the landing").
    owns: [budget, H1 landing forecast, inventory and cash risk, FX]

directory:            # other accounts in the company tenant (not team members): reachable by email
  - id: robert
    name: Robert Hayes
    role: Executive Officer, Business Planning
  - id: sarah
    name: Sarah Miller
    role: Purchasing Manager
  - id: tom
    name: Tom Wilson
    role: Enterprise Sales Manager
  - id: max
    name: Max (AI)
    email: max@thirdwave.co.jp
    role: AI teammate account (licensed mailbox + calendar; the Max app uses it app-only, limited by Exchange RBAC)

bot:
  id: max
  name: Max (AI)
  colour: "#FF6B00"
  role: AI meeting assistant
  behaviour: >
    Listens and takes notes. Speaks only when addressed by name or asked a direct question it can answer from
    the thread, documents or past meetings. Produces summary, decisions and action items after the meeting.
