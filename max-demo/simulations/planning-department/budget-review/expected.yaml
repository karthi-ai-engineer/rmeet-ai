# Answer key for Meeting 4 (H2 Supply & Pricing Decisions, 26 Nov 2026).
# Used to score Max's notes after an autopilot run. If the real host (Karthi) makes different decisions in a
# live run, score against what was actually said. Source of truth: WORLD.md "Expected outcome of Meeting 4".

decisions:
  - id: D1
    text: >
      Memory: commit 70% of the Q1 2027 need = 84,000 16GB DDR5 DIMMs at +14% (≈ ¥0.98B); the other 30% bought
      spot/monthly; no spec-down on GALLERIA.
    keywords: ["70%", "84,000", "0.98", "spot", "spec-down"]
  - id: D2
    text: >
      Pricing: end the +¥9,696 32GB upgrade when Black Friday ends (4 Dec); new upgrade price +¥19,800; base price
      increase from 6 Jan 2027: +¥10,000 on GALLERIA X / E and THIRDWAVE-G, +¥15,000 on GALLERIA F / S.
    keywords: ["9,696", "4 Dec", "19,800", "6 Jan", "10,000", "15,000"]
  - id: D3
    text: >
      GPUs: reserve 100 high-end GPUs for the PREF-AI-27 tender now and ask the board partner for 60 more;
      GALLERIA RTX 5080/5090 lead-time target relaxed to 10 days until the end of January.
    keywords: ["100", "60", "PREF-AI-27", "10 days"]
  - id: D4
    text: >
      New Year: revive the ¥2,027 SSD lucky bag (50 bags) and sell 1,200 previous-gen lucky boxes.
    keywords: ["2,027", "50", "1,200"]
  - id: D5
    text: >
      Platform: no Nova Lake / Zen 6 pre-announcement before 1 Feb 2027; sell current-gen CPU/board stock down to
      6 weeks of cover or less by the end of January.
    keywords: ["Nova Lake", "Zen 6", "1 Feb", "6 weeks"]

