  - beat: b04_max_memory_quote
    facts: ["14%", "120000", "1.4"]
  - beat: b09_max_bf_upgrade
    facts: ["70%", "4300"]
  - beat: b14_max_tender
    facts: ["160", "600", "31 Mar"]
  - beat: b19_max_luckybag
    facts: ["shortage", "31 Dec"]

scoring:
  decisions: 3 points each (15)
  action_items: 2 points each, owner + due date both needed (12)
  final_numbers: 3 points
  risks: 1 point each (3)
  max_questions: 5 points each, all facts present (20)
  total: 53
