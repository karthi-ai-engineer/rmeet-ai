<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max Voice Test</title>
<style>
  :root {
    --bg: #f4f4f2;
    --panel: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --line: #e7e7e7;
    --user: #f1f1f1;
    --avatar: #ff6b00;
    --error: #d93025;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121214;
      --panel: #1b1b1e;
      --text: #f2f2f2;
      --muted: #9a9aa0;
      --line: #2b2b30;
      --user: #26262a;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .app { display: grid; grid-template-columns: 1fr 420px; height: 100vh; }

  /* ---------- Stage ---------- */
  .stage {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px 16px;
    background: color-mix(in srgb, var(--avatar) 14%, #ffffff);
  }
  .brand {
    position: absolute; top: 18px; left: 20px;
    display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: #1d1d1f;
  }
  .badge {
    font-weight: 500; font-size: 12px; color: #5a5a5f;
    background: rgba(255,255,255,.7); border-radius: 999px; padding: 3px 10px;
  }
  .avatar-host { width: min(52vmin, 420px); }

  .status { min-height: 22px; font-size: 14.5px; color: #3a3a3c; text-align: center; max-width: 520px; }
  .status.error { color: var(--error); }

  .mic {
    position: relative; width: 84px; height: 84px; border-radius: 50%;
    border: none; cursor: pointer; background: var(--avatar); color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--avatar) 40%, transparent);
    transition: transform .12s ease, background .2s;
    --lvl: 0;
  }
  .mic:hover { transform: scale(1.04); }
  .mic:active { transform: scale(.96); }
  .mic:disabled { cursor: progress; opacity: .6; transform: none; }
  .mic svg { width: 34px; height: 34px; position: relative; z-index: 1; }
  .mic::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: var(--avatar); opacity: 0; transform: scale(1);
    transition: transform .08s linear, opacity .2s;
  }
  .mic.recording { background: #e5342b; }
  .mic.recording::before {
    background: #e5342b; opacity: .25;
    transform: scale(calc(1.1 + var(--lvl) * 0.6));
  }
  .mic .stop { display: none; }
  .mic.recording .mic-icon { display: none; }
  .mic.recording .stop { display: block; }
  .hint { font-size: 12.5px; color: #6b6b70; }
  .hint kbd {
    font-family: inherit; border: 1px solid rgba(0,0,0,.18); border-radius: 4px;
    padding: 0 5px; background: rgba(255,255,255,.6);
  }

  .banner {
    display: none; position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    background: #fff4e5; color: #8a4b00; border: 1px solid #ffd8a8;
    padding: 10px 14px; border-radius: 10px; font-size: 13.5px; max-width: 90%;
  }
  .banner.show { display: block; }
  .banner code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; }

  /* ---------- Conversation ---------- */
  .chat {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-left: 1px solid var(--line);
  }
  .chat header {
    padding: 18px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .chat h2 { margin: 0; font-size: 15px; }
  .clear {
    border: none; background: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
  }
  .clear:hover { color: var(--text); }
  .messages { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .empty b { color: var(--text); }

  .msg { max-width: 88%; display: flex; flex-direction: column; gap: 4px; }
  .msg .who { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .msg .text { padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.user .text { background: var(--user); border-bottom-right-radius: 5px; }
  .msg.bot .text {
    background: color-mix(in srgb, var(--avatar) 12%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--avatar) 25%, transparent);
    border-bottom-left-radius: 5px;
  }
  .msg.bot.typing .text::after {
    content: "▍"; color: var(--avatar); animation: blink 1s steps(1) infinite;
  }
  .msg .meta { font-size: 11px; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
    .stage { padding-top: 64px; }
    .avatar-host { width: min(62vw, 320px); }
    .chat { border-left: none; border-top: 1px solid var(--line); min-height: 45vh; }
  }
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="brand">Max <span class="badge" id="modelBadge">connecting…</span></div>
    <div class="banner" id="keyBanner">
      No Gemini API key found. Copy <code>voice-chat/.env.example</code> to <code>voice-chat/.env</code>,
      paste your key, then restart the server.
    </div>

    <div class="avatar-host" id="avatarHost"></div>
    <div class="status" id="status">Tap the mic, speak, then tap again.</div>

    <button class="mic" id="micBtn" aria-label="Start talking">
      <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="3" width="6" height="11" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>
      </svg>
      <svg class="stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <rect x="7" y="7" width="10" height="10" rx="2.5"/>
      </svg>
    </button>
    <div class="hint">or press <kbd>Space</kbd></div>
  </main>

  <section class="chat">
    <header>
      <h2>Conversation</h2>
      <button class="clear" id="clearBtn">Clear</button>
    </header>
    <div class="messages" id="messages">
      <div class="empty" id="empty">
        <b>Say hi to Max 👋</b><br>
        Tap the mic, ask anything,<br>and Max's reply will appear here.
      </div>
    </div>
  </section>
</div>

<script src="../bot-avatar/avatar.js"></script>
<script src="app.js"></script>
</body>
</html>
