# Meeting 4 (LIVE): H1 FY2027 Budget Review
# The agents (Prince, Daniel, Jacob) improvise their lines with the LLM, but
# follow these beats in order. Karthi is the real user; host_fallback lines are
# used only in "autopilot" mode (no human) so the meeting can run end to end.

meeting:
  title: H1 FY2027 Budget Review
  date: 2026-11-20T10:00:00
  duration_min: 30
  host: karthi
  attendees: [karthi, prince, daniel, jacob, max]
  agenda:
    - Close the 220K gap
    - Decide on the warehouse automation pilot
    - Decide on the Fresh Home Spring campaign
    - Confirm final numbers for the CFO (due 28 Nov)

rules_for_agents:
  - Stay in character (see team.yaml). Speak 1-3 sentences per turn, like a real meeting.
  - Only state facts that exist in WORLD.md, the thread, the documents or past meetings.
  - Do not jump ahead of the current beat. Let the host (Karthi) close each decision.
  - If Karthi decides differently from the beat's expected outcome, accept it and adapt later beats.

beats:
  - id: b01_open
    speaker: karthi
    goal: Open the meeting, welcome Max, read the agenda.
    host_fallback: >
      Morning everyone, and welcome Max, our AI note-taker today. Four things:
      close the 220K gap, decide on the pilot, decide on the campaign, and lock
      the numbers for Elena.

  - id: b02_gap
    speaker: prince
    goal: State v2 total 11,720K vs target 11,500K, gap 220K, and recommend options A+B+C (60+90+70).
    must_mention: ["11,720", "220", "A, B and C"]

  - id: b03_react
    speakers: [daniel, jacob]
    goal: >
      Daniel says Northgate sounded open to the 3% for a 2-year deal. Jacob is
      relieved option F (cut digital ads 10%) is not on the table.

  - id: b04_max_risk
    speaker: jacob
    goal: Ask Max what the risk is on option B.
    max_question: "Max, what's the risk with option B again?"
    max_expected_answer: >
      Option B depends on Northgate Freight agreeing to the ~3% rate cut before
      the 31 Jan 2027 renewal. If it fails, the budget is 90K short and option D
      or E would be needed instead.

  - id: b05_decide_gap
    speaker: karthi
    goal: Decide to adopt options A + B + C to close the 220K gap.
    host_fallback: Okay, let's go with A, B and C. That closes the 220.
    decision: D1

  - id: b06_pilot_pitch
    speaker: daniel
    goal: >
      Pitch the 1-site Vector pilot (Riverside, 200K, start 1 Mar, go-live 1 May,
      ~52.5K/month, 105K H1 savings, net +95K). Mention Riverside's 2.1% error
      rate in September. Admit one risk: if installation slips, the 105K of H1
      savings shrinks.
    must_mention: ["200K", "Riverside", "105K", "installation"]

  - id: b07_max_history
    speaker: prince
    goal: Ask Max when Vector was shortlisted and what LiftLine's lead time was.
    max_question: "Max, when did we shortlist Vector, and what was LiftLine's lead time?"
    max_expected_answer: >
      Vector Robotics and LiftLine Systems were shortlisted on 20 Oct (Autonix
      dropped). LiftLine's lead time was 14 weeks vs 8 weeks for Vector.

  - id: b08_pilot_funding
    speaker: prince
    goal: >
      Point out the net +95K must be covered under the CFO rule; propose using
      options D + E (45 + 50 = 95). Warn that option E means zero contingency
      for H1.
    must_mention: ["D", "E", "95K", "contingency"]

  - id: b09_decide_pilot
    speaker: karthi
    goal: Approve the 1-site pilot, funded by its own savings plus options D + E.
    host_fallback: >
      Then let's approve the Riverside-only pilot with Vector, and cover the 95K
      with options D and E.
    decision: D2

  - id: b10_campaign_pitch
    speaker: jacob
    goal: Push for campaign Option A (+300K, +4.5%, ~1,200K revenue).

  - id: b11_campaign_pushback
    speaker: prince
    goal: Say Option A breaks the 11,500K ceiling; only Option B (net 0) fits.

  - id: b12_max_roi
    speaker: jacob
    goal: Ask Max what uplift was estimated for Option B.
    max_question: "Max, what uplift did I estimate for Option B?"
    max_expected_answer: >
      About +2.5% Home Essentials revenue, roughly +670K, at net zero spend
      (reallocated from print catalog −90K and trade events −60K). Jacob posted
      it in the thread on 16 Nov.

  - id: b13_decide_campaign
    speaker: karthi
    goal: Approve campaign Option B.
    host_fallback: Let's do Option B. The campaign runs, and the budget doesn't grow.
    decision: D3

  - id: b14_recap_numbers
    speaker: prince
    goal: Confirm the final total stays at 11,500K, on target.
    must_mention: ["11,500"]

  - id: b15_actions
    speaker: karthi
    goal: Assign the action items (see expected.yaml) and ask Max to post the summary.
    host_fallback: >
      Actions: Prince, v3 of the budget by Tuesday the 24th. Daniel, confirm
      Vector's Riverside quote by the 25th. Jacob, update the campaign plan to
      Option B by the 25th. Prince, start the Northgate call by 4 December. I'll
      send the final budget to Elena by the 28th. Max, please post the summary.

  - id: b16_close
    speaker: karthi
    goal: Thank everyone and close.
    host_fallback: Great work everyone. Thanks.
